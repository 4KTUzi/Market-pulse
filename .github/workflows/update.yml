name: Update market data

on:
  schedule:
    # 02:07, 08:07, 14:07, 20:07 UTC = 06:07, 12:07, 18:07, 00:07 in Dubai (UTC+4).
    # Off the hour on purpose: GitHub delays jobs scheduled exactly on the hour.
    - cron: "7 2,8,14,20 * * *"
  workflow_dispatch:        # lets you press "Run workflow" manually
  push:
    branches: [main]

concurrency:
  group: market-pulse
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commit the refreshed data files
      pages: write          # publish the site
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest market data
        run: python fetch_data.py

      - name: Save data to the repo (keeps last good data if a source fails later)
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data.js
          git diff --staged --quiet || git commit -m "Update market data"
          git pull --rebase origin main
          git push

      - name: Collect the files to publish
        run: |
          mkdir _site
          cp index.html data.js data.json _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
